# Read-only V3 dashboard gateway. This does not deploy or modify the bot.
name = "eth-15-scout-v3-view"
main = "viewer-worker.js"
compatibility_date = "2026-11-18"
workers_dev = true

[vars]
MARKET_PROXY = "https://eth-15-scout-api.leoseazon.workers.dev/markets"

[[durable_objects.bindings]]
name = "SCOUT"
class_name = "ScoutEngine"
script_name = "eth-15-scout-cloud-v3test"

# Configure SCOUT_LOGIN_USER, SCOUT_LOGIN_PASSWORD and
# SCOUT_SESSION_SECRET as Cloudflare encrypted secrets (not in Git).
# This is a separate read-only viewer: no cron and no trading endpoints.
# Cloudflare Workers approximate per-location login-attempt limit.
[[ratelimits]]
name = "LOGIN_RATE_LIMIT"
namespace_id = "157211"
[ratelimits.simple]
limit = 8
period = 60
